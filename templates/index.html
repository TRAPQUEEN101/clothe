<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Boutique Noir</title>
</head>
<body>
    <nav>
        <a href="/" class="logo">Candy`s Fassion Hub</a>
        <a href="/cart" class="cart-status">🛒 My Cart ({{ cart_count }})</a>
    </nav>

    <div class="container">
        <header style="text-align: center; margin-bottom: 60px;">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">New Products</h1>
            <p style="color: var(--text-muted);">Curated luxury essentials for the modern lifestyle.</p>
        </header>

        <div class="product-grid">
            {% for item in items %}
            <div class="product-card">
                <a href="{{ url_for('product_detail', item_id=item['id']) }}" style="text-decoration: none;">
                    <img src="{{ url_for('static', filename='uploads/' + item['img']) }}">
                    <h3>{{ item['name'] }}</h3>
                    <div class="price">${{ item['price'] }}</div>
                </a>
                <a href="{{ url_for('add_to_cart', item_id=item['id']) }}" class="btn-action">Add to Cart</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
